/* Refinamento visual dos cards: interação, zoom e convite para abrir detalhes */
.card{
  position:relative;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(54,48,36,.075);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card .im{overflow:hidden;isolation:isolate}
.card .im::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:inherit;background-position:center;background-size:cover;background-repeat:no-repeat;
  transition:transform .35s ease,filter .35s ease;
}
.card .im>*{z-index:2}
.card .card-status,.card .card-rating{z-index:4}
.card .image-placeholder{position:relative;z-index:2}
.card .cb{position:relative;gap:6px;padding-bottom:10px}
.card .cb .pill{margin-bottom:1px}
.card .cb h3{font-size:16px;line-height:1.25;font-weight:750;letter-spacing:.05px}
.card-address{align-items:flex-start;gap:6px;color:#68736b;font-size:11px;line-height:1.35;min-height:0;max-height:2.7em}
.card-address .address-icon{flex:0 0 auto;font-size:12px;line-height:1.25}
.card-cta{
  margin-top:auto;padding-top:8px;border-top:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;
}
.card-cta>span{min-width:0;color:var(--mu);font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cta strong{flex:0 0 auto;color:#247653;font-size:11px;font-weight:750;white-space:nowrap;transition:color .2s ease,gap .2s ease}
.card-cta strong span{display:inline-block;transition:transform .2s ease}
@media(hover:hover){
  .card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(54,48,36,.15);border-color:#cbd9cc}
  .card:hover .im::before{transform:scale(1.055);filter:saturate(1.06)}
  .card:hover .card-cta strong{color:#155d3d}
  .card:hover .card-cta strong span{transform:translateX(3px)}
}
.card:focus-visible{outline:3px solid #7ab895;outline-offset:3px}
@media(max-width:760px){
  .card .cb{gap:6px;padding:10px 12px 11px}
  .card .cb h3{font-size:16px}
  .card-address{font-size:11px}
  .card-cta{padding-top:7px}
  .card-cta>span{font-size:9px}
  .card-cta strong{font-size:10px}
}
@media(max-width:380px){
  .card .cb{padding:8px 9px 9px;gap:5px}
  .card .cb h3{font-size:14px}
  .card-address{font-size:10px}
  .card-cta>span{font-size:8px}
  .card-cta strong{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
  .card,.card .im::before,.card-cta strong,.card-cta strong span{transition:none!important}
}

// Interpreta horários escritos em linguagem natural simples, sem chamadas externas.
// Formatos reconhecidos: "Segunda a sexta: 08:00 às 18:00", "Sábado: 08h às 12h",
// "Domingo fechado" e múltiplos intervalos separados por "e".
function normalizarHorarioTexto(texto){return String(texto||'').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/\bsegunda-feira\b/g,'segunda').replace(/\bterca-feira\b/g,'terca').replace(/\bquarta-feira\b/g,'quarta').replace(/\bquinta-feira\b/g,'quinta').replace(/\bsexta-feira\b/g,'sexta');}
function diasDaLinha(linha){
 const dias=[['domingo',0],['dom',0],['segunda',1],['seg',1],['terca',2],['ter',2],['quarta',3],['qua',3],['quinta',4],['qui',4],['sexta',5],['sex',5],['sabado',6],['sab',6]];
 const encontrados=[];for(const [nome,num] of dias){const re=new RegExp('(^|[^a-z])'+nome+'([^a-z]|$)','g');let m;while((m=re.exec(linha))!==null)encontrados.push({num,index:m.index+ m[1].length,nome});}
 encontrados.sort((a,b)=>a.index-b.index);
 const unicos=[];for(const d of encontrados)if(!unicos.some(x=>x.num===d.num))unicos.push(d);
 if(/todos os dias|diariamente|dia todo/.test(linha))return [0,1,2,3,4,5,6];
 if(/fim de semana/.test(linha))return [0,6];
 if(unicos.length>=2){const entre=linha.slice(unicos[0].index,unicos[1].index);if(/\b(a|ate)\b/.test(entre)){const a=unicos[0].num,b=unicos[1].num,arr=[];let d=a;for(let i=0;i<7;i++){arr.push(d);if(d===b)break;d=(d+1)%7;}return arr;}}
 return unicos.map(x=>x.num);
}
function intervalosDaLinha(linha){
 const re=/(\d{1,2})(?:\s*[:h]\s*(\d{2})?)?\s*(?:as|a|ate|-)\s*(\d{1,2})(?:\s*[:h]\s*(\d{2})?)?/g;
 const saida=[];let m;while((m=re.exec(linha))!==null){const inicio=Number(m[1])*60+Number(m[2]||0),fim=Number(m[3])*60+Number(m[4]||0);if(inicio<1440&&fim<=1440&&inicio!==fim)saida.push([inicio,fim>inicio?fim:fim+1440]);}
 return saida;
}
function interpretarHorario(raw){
 const original=String(raw||'').trim();if(!original)return null;
 const texto=normalizarHorarioTexto(original);const linhas=texto.split(/[\n;|]+/).map(x=>x.trim()).filter(Boolean);const agenda=Array.from({length:7},()=>({definido:false,intervalos:[]}));let reconheceuDia=false,ultimosDias=[];
 for(const linha of linhas){let dias=diasDaLinha(linha);const intervalos=intervalosDaLinha(linha);if(!dias.length&&intervalos.length)dias=ultimosDias;if(!dias.length)continue;if(diasDaLinha(linha).length)ultimosDias=dias;reconheceuDia=true;const fechado=/fechado|nao abre|nao funciona|folga|descanso/.test(linha);for(const dia of dias){agenda[dia].definido=true;if(!fechado)agenda[dia].intervalos.push(...intervalos);}}
 if(!reconheceuDia)return null;
 return agenda;
}
function horarioAtualFortaleza(){const partes=new Intl.DateTimeFormat('en-US',{timeZone:'America/Fortaleza',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v={};partes.forEach(p=>v[p.type]=p.value);const mapa={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};return {dia:mapa[v.weekday],minuto:Number(v.hour)*60+Number(v.minute)};}
function calcularFuncionamento(raw){
 const agenda=interpretarHorario(raw);if(!agenda)return 'indisponivel';const agora=horarioAtualFortaleza(),hoje=agenda[agora.dia];
 if(hoje.definido){for(const [inicio,fim] of hoje.intervalos){if(agora.minuto>=inicio&&agora.minuto<Math.min(fim,1440))return 'aberto';}}
 // Também considera expediente que atravessa a meia-noite, iniciado no dia anterior.
 const ontem=agenda[(agora.dia+6)%7];if(ontem.definido){for(const [inicio,fim] of ontem.intervalos){if(fim>1440&&agora.minuto<fim-1440)return 'aberto';}}
 if(hoje.definido)return 'fechado';
 // Em uma agenda semanal reconhecida, dias não listados são considerados fechados.
 if(agenda.some(d=>d.definido))return 'fechado';
 return 'indisponivel';
}

async function copiarLinkCompartilhamento(linkCodificado,plataforma){
 const url=decodeURIComponent(linkCodificado);
 try{
  if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(url);
  else{
   const campo=document.createElement('textarea');campo.value=url;campo.setAttribute('readonly','');
   campo.style.position='fixed';campo.style.opacity='0';document.body.appendChild(campo);
   campo.select();campo.setSelectionRange(0,campo.value.length);
   const ok=document.execCommand('copy');campo.remove();
   if(!ok)throw new Error('Falha ao copiar');
  }
  alert(plataforma?'Link copiado! Agora cole no Instagram.':'Link da loja copiado!');
 }catch(error){window.prompt('Copie o link desta loja:',url)}
}

async function form(id){let l=id?lojas.find(x=>String(x.id)===String(id)):null;if(id&&!l){app.innerHTML='<div class="msg">Carregando cadastro…</div>';const {data,error}=await sb.from('Lojas').select('*').eq('id',id).maybeSingle();if(error||!data){alert('Não foi possível localizar esta loja.');go('admin');return;}l=norm(data);}draft=l?{...l,galeria:[...l.galeria]}:{ativo:true,galeria:[],produtos_servicos:[],formas_pagamento:[]};app.innerHTML=`<div class="ad"><button class="btn s ibtn" onclick="go('admin')" aria-label="Voltar" title="Voltar"><span class="ic ic-voltar" aria-hidden="true"></span></button><h2>${id?'Editar':'Nova'} loja</h2><form class="f" id="sf"><label>Nome<input name="nome" required value="${esc(draft.nome)}"></label><label>Categoria<select name="categoria" required><option value="">Selecione</option>${cats.map(c=>`<option ${c.nome===draft.cat?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Descrição<textarea name="descricao">${esc(draft.desc)}</textarea></label><label>Endereço<input name="endereco" value="${esc(draft.end)}"></label><label>Telefone / WhatsApp<input name="telefone_whatsapp" value="${esc(draft.wpp)}" required></label><label>Horário<input name="horario_atendimento" value="${esc(draft.horario)}"></label><label>Produtos e serviços <textarea name="produtos_servicos_texto" rows="4" placeholder="Ex.: Salgados, Tapiocas recheadas, Sanduíches">${esc(draft.produtos_servicos.join('\n'))}</textarea><span class="file-hint">Separe os itens por vírgula ou coloque um item por linha. Ex.: Pastéis, Tapiocas, Sucos.</span></label><fieldset class="payment-options-field"><legend>Formas de pagamento</legend><div class="payment-options">${['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência bancária','Vale-alimentação','Vale-refeição'].map((op,i)=>`<label class="payment-option"><input type="checkbox" name="formas_pagamento_opcao" value="${esc(op)}" ${draft.formas_pagamento.includes(op)?'checked':''}><span>${esc(op)}</span></label>`).join('')}</div><span class="file-hint">Selecione todas as formas de pagamento aceitas pelo estabelecimento.</span></fieldset><label>Instagram<input name="instagram" value="${esc(draft.insta)}"></label><label>Imagem do card<input type="file" id="logo" accept="image/*"><div class="upload-previews" id="preview-logo"></div><span class="file-hint">A imagem será comprimida automaticamente antes do envio (máximo final: 120 KB).</span></label><label>Banner<input type="file" id="banner" accept="image/*"><div class="upload-previews" id="preview-banner"></div><span class="file-hint">Dimensões obrigatórias: 1137 × 380 px. Compressão automática (máximo final: 120 KB).</span></label><label>Fotos da galeria<input type="file" id="galeria" accept="image/*" multiple><div class="upload-previews" id="preview-galeria"></div><span class="file-hint">Todas as fotos serão comprimidas automaticamente (máximo final: 120 KB por foto).</span></label><label><input type="checkbox" name="ativo" ${draft.ativo!==false?'checked':''}> Loja ativa</label><div class="err" id="er" aria-live="polite"></div><button class="btn ibtn" id="save-store" aria-label="Salvar loja" title="Salvar loja"><span class="ic ic-salvar" aria-hidden="true"></span></button></form></div>`;
function storagePathFromPublicUrl(url){
 try{const u=new URL(url);if(u.origin!==new URL(SUPABASE_URL).origin)return null;const marker='/storage/v1/object/public/fotos_lojas/';const at=u.pathname.indexOf(marker);if(at<0)return null;return decodeURIComponent(u.pathname.slice(at+marker.length)).split('?')[0]}catch{return null}
}

function refreshUploadPreviews(){
 const logoBox=document.getElementById('preview-logo'),bannerBox=document.getElementById('preview-banner'),galBox=document.getElementById('preview-galeria');if(!logoBox||!bannerBox||!galBox)return;
 const one=(kind,current)=>{const input=document.getElementById(kind),file=input.files?.[0];if(file){const url=URL.createObjectURL(file);return previewThumb(url,file.name,'new-one',kind)}return current?previewThumb(current,kind==='logo'?'Imagem atual do card':'Banner atual','stored',kind):'<span class="upload-empty">Nenhuma imagem cadastrada.</span>'};

document.addEventListener('click',event=>{
 const button=event.target.closest('.upload-remove');if(!button)return;

async function removeStoredImage(kind,index){
 const id=draft?.id;if(!id){alert('Salve a loja antes de remover imagens já armazenadas.');return}
 const current=kind==='logo'?draft.logo:kind==='banner'?draft.banner:draft.galeria[index];if(!current)return;
 if(!confirm('Excluir esta imagem permanentemente do site e do Supabase?'))return;
 const err=document.getElementById('er');const buttons=[...document.querySelectorAll('.upload-remove')];buttons.forEach(b=>b.disabled=true);if(err)err.textContent='Excluindo imagem do Supabase…';
 let column,oldValue,newValue;
 try{
  const path=storagePathFromPublicUrl(current);if(!path)throw new Error('Não foi possível identificar o arquivo no bucket fotos_lojas. A imagem não foi removida.');
  if(kind==='logo'){column='imagem_card';oldValue=draft.logo;newValue=null}
  else if(kind==='banner'){column='Banner';oldValue=draft.banner;newValue=null}
  else{column='galeria';oldValue=JSON.stringify(draft.galeria);const next=[...draft.galeria];next.splice(index,1);newValue=JSON.stringify(next)}

  // Primeiro atualiza a referência no cadastro, mas só altera a interface após confirmar a exclusão no Storage.
  const {error:updateError}=await sb.from('Lojas').update({[column]:newValue}).eq('id',id);
  if(updateError)throw new Error('Não foi possível atualizar o cadastro da loja: '+updateError.message);

  const {error:storageError}=await sb.storage.from('fotos_lojas').remove([path]);
  if(storageError){
   // Se o Storage negar a exclusão, restaura a referência para a imagem continuar aparecendo e permitir nova tentativa.
   const {error:rollbackError}=await sb.from('Lojas').update({[column]:oldValue}).eq('id',id);
   if(rollbackError)throw new Error('O Supabase Storage recusou a exclusão ('+storageError.message+') e não foi possível restaurar a referência no cadastro ('+rollbackError.message+'). Verifique os dados da loja antes de continuar.');
   throw new Error('O Supabase não permitiu excluir o arquivo ('+storageError.message+'). A miniatura e o cadastro foram mantidos. Verifique a permissão DELETE do bucket fotos_lojas.');
  }

  if(kind==='logo')draft.logo='';
  else if(kind==='banner')draft.banner='';
  else{const next=[...draft.galeria];next.splice(index,1);draft.galeria=next}
  const loja=lojas.find(x=>String(x.id)===String(id));if(loja){loja.logo=draft.logo;loja.banner=draft.banner;loja.galeria=[...draft.galeria]}
  refreshUploadPreviews();
  if(err)err.textContent='Imagem excluída da loja e permanentemente do Storage do Supabase.';
 }catch(e){if(err)err.textContent='Não foi possível excluir a imagem: '+(e.message||e);buttons.forEach(b=>b.disabled=false)}
}
['logo','banner','galeria'].forEach(kind=>document.getElementById(kind)?.addEventListener('change',refreshUploadPreviews));refreshUploadPreviews();
async function validarImagem(file,rotulo,exigirBanner=false){if(!file)return;if(!file.type.startsWith('image/'))throw new Error(`${rotulo}: selecione um arquivo de imagem.`);if(exigirBanner){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Não foi possível ler as dimensões do banner.'));img.src=url});if(img.naturalWidth!==1137||img.naturalHeight!==380)throw new Error(`Banner: a imagem precisa ter exatamente 1137 × 380 px. A imagem selecionada tem ${img.naturalWidth} × ${img.naturalHeight} px.`)}finally{URL.revokeObjectURL(url)}}}
async function comprimirImagem(file,rotulo,manterDimensoes=false){if(!file)return null;let img,url=URL.createObjectURL(file);try{img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error(`${rotulo}: não foi possível abrir a imagem.`));img.src=url});const originalW=img.naturalWidth,originalH=img.naturalHeight;let w=manterDimensoes?originalW:Math.min(originalW,1600),h=manterDimensoes?originalH:Math.round(originalH*(w/originalW));const limite=120*1024;let melhor=null;for(let escala=1;escala>=.4;escala-=.1){if(!manterDimensoes&&escala<1){w=Math.max(1,Math.round(Math.min(originalW,1600)*escala));h=Math.max(1,Math.round(Math.min(originalW,1600)*escala*originalH/originalW))}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Não foi possível preparar a imagem para compressão.');ctx.drawImage(img,0,0,w,h);for(const qualidade of [.82,.72,.62,.52,.42,.32,.24]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',qualidade));if(!blob)throw new Error('O navegador não conseguiu comprimir a imagem.');if(!melhor||blob.size<melhor.size)melhor=blob;if(blob.size<=limite)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp',lastModified:Date.now()})}if(manterDimensoes)break}if(!melhor||melhor.size>limite)throw new Error(`${rotulo}: não foi possível reduzir a imagem para até 120 KB mantendo ${manterDimensoes?'as dimensões obrigatórias do banner':'uma qualidade adequada'}. Selecione uma imagem menor.`);return new File([melhor],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp',lastModified:Date.now()})}finally{URL.revokeObjectURL(url)}}
document.getElementById('sf').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,botao=document.getElementById('save-store'),erro=document.getElementById('er');botao.disabled=true;erro.textContent='Preparando e comprimindo as imagens…';try{let fd=new FormData(f),d=Object.fromEntries(fd.entries());d.ativo=f.ativo.checked;d.produtos_servicos=parseLista(fd.get('produtos_servicos_texto'));d.formas_pagamento=fd.getAll('formas_pagamento_opcao');delete d.formas_pagamento_opcao;delete d.produtos_servicos_texto;const logoOriginal=document.getElementById('logo').files[0],bannerOriginal=document.getElementById('banner').files[0],galeriaOriginal=[...document.getElementById('galeria').files];await validarImagem(logoOriginal,'Imagem do card');await validarImagem(bannerOriginal,'Banner',true);for(const file of galeriaOriginal)await validarImagem(file,'Foto da galeria');const [logoFile,bannerFile]=await Promise.all([comprimirImagem(logoOriginal,'Imagem do card'),comprimirImagem(bannerOriginal,'Banner',true)]);erro.textContent=galeriaOriginal.length?`Comprimindo ${galeriaOriginal.length} foto(s) em paralelo…`:'';const galeriaFiles=await Promise.all(galeriaOriginal.map((file,i)=>comprimirImagem(file,`Foto ${i+1} da galeria`)));const folder=(draft.nome||d.nome||'loja').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');async function upload(file,sub){if(!file)return null;const path=`${folder}/${sub}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await sb.storage.from('fotos_lojas').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return fileUrl(path)}erro.textContent='Enviando imagens otimizadas…';const [logo,banner,...galeriaUrls]=await Promise.all([upload(logoFile,'imagem_card'),upload(bannerFile,'banner'),...galeriaFiles.map(file=>upload(file,'galeria'))]);let gal=[...draft.galeria,...galeriaUrls.filter(Boolean)];d.imagem_card=logo||draft.logo||null;d.Banner=banner||draft.banner||null;d.galeria=JSON.stringify(gal);const result=id?await sb.from('Lojas').update(d).eq('id',id).select('*').single():await sb.from('Lojas').insert(d).select('*').single();if(result.error)throw result.error;const saved=norm(result.data),at=lojas.findIndex(x=>String(x.id)===String(saved.id));if(at>=0)lojas[at]=saved;else lojas.push(saved);await admin()}catch(err){erro.textContent='Erro ao salvar: '+err.message;botao.disabled=false}}}
init();
